        SCIENCE > HUMAN DIMENSIONS > NATURAL HAZARDS\",\n        \"VIS (0.40 - 0.75
        \xB5m)\",\n        \"NIR (0.75 - 1.30 \xB5m)\",\n        \"Sun-synchronous\",\n
