        \     \"created\": \"2019-05-29T00:00:00.00Z\",\n      \"description\": \"The
        ERS data reprocessed with the ASPS facility is also available in the UWI format
        to maintain the compatibility with the FD (Fast Delivery) products.  The ASPS
        UWI product is organised in frames of 500 x 500 km providing the radar backscattering
        sigma nought for the three beams of the instrument plus the wind speed and
        direction.  The wind retrieval is performed with the CMOD5N geophysical model
        function derived by ECMWF to compute the neutral winds rather than 10m winds.
        \ ASPS UWI products are provided with a spatial resolution of 50x50km and
        a grid spacing of 25 km. One product covers one orbit from ascending node
        crossing.  Please consult the Product Quality Readme file (https://earth.esa.int/eogateway/documents/20142/37627/ERS-WS-Product-Quality-Readmefile-ENVI-GSOP-EOGD-QD-15-0130-issue1.2.pdf)
        before using the ERS ASPS data.\",\n      \"type\": \"Collection\",\n      \"title\":
