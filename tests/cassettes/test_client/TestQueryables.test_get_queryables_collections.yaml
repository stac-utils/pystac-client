      string: '{"id":"fia","type":"Collection","links":[{"rel":"items","type":"application/geo\u002Bjson","href":"https://planetarycomputer.microsoft.com/api/stac/v1/collections/fia/items"},{"rel":"parent","type":"application/json","href":"https://planetarycomputer.microsoft.com/api/stac/v1/"},{"rel":"root","type":"application/json","href":"https://planetarycomputer.microsoft.com/api/stac/v1/"},{"rel":"self","type":"application/json","href":"https://planetarycomputer.microsoft.com/api/stac/v1/collections/fia"},{"rel":"http://www.opengis.net/def/rel/ogc/1.0/queryables","type":"application/schema\u002Bjson","title":"Queryables","href":"https://planetarycomputer.microsoft.com/api/stac/v1/collections/fia/queryables"}],"title":"Forest
        Inventory and Analysis","assets":{"guide":{"href":"https://www.fia.fs.fed.us/library/database-documentation/current/ver80/FIADB%20User%20Guide%20P2_8-0.pdf","type":"application/pdf","roles":["metadata"],"title":"Database
        Description and User Guide"},"thumbnail":{"href":"https://ai4edatasetspublicassets.blob.core.windows.net/assets/pc_thumbnails/fia.png","type":"image/gif","title":"Forest
        Inventory and Analysis"},"geoparquet-items":{"href":"abfs://items/fia.parquet","type":"application/x-parquet","roles":["stac-items"],"title":"GeoParquet
        STAC items","description":"Snapshot of the collection\u0027s STAC items exported
        to GeoParquet format.","msft:partition_info":{"is_partitioned":false},"table:storage_options":{"account_name":"pcstacitems"}}},"extent":{"spatial":{"bbox":[[138.06,0.92,163.05,9.78],[165.28,4.57,172.03,14.61],[131.13,2.95,134.73,8.1],[-124.763068,24.523096,-66.949895,49.384358],[-179.148909,51.214183,-129.974167,71.365162],[172.461667,51.357688,179.77847,53.01075],[-178.334698,18.910361,-154.806773,28.402123],[144.618068,13.234189,144.956712,13.654383],[-67.945404,17.88328,-65.220703,18.515683],[144.886331,14.110472,146.064818,20.553802],[-65.085452,17.673976,-64.564907,18.412655],[-171.089874,-14.548699,-168.1433,-11.046934],[-178.334698,18.910361,-154.806773,28.402123]]},"temporal":{"interval":[["2020-06-01T00:00:00Z",null]]}},"license":"CC0-1.0","keywords":["Forest","Species","Carbon","Biomass","USDA","Forest
        Service"],"providers":[{"url":"https://www.fia.fs.fed.us/","name":"Forest
        Inventory \u0026 Analysis","roles":["producer","licensor"]},{"url":"https://carbonplan.org/","name":"CarbonPlan","roles":["processor"]},{"url":"https://planetarycomputer.microsoft.com","name":"Microsoft","roles":["host"]}],"description":"Status
        and trends on U.S. forest location, health, growth, mortality, and production,
        from the U.S. Forest Service\u0027s  [Forest Inventory and Analysis](https://www.fia.fs.fed.us/)
        (FIA) program.\n\nThe Forest Inventory and Analysis (FIA) dataset is a nationwide
        survey of the forest assets of the United States. The FIA research program
        has been in existence since 1928.  FIA\u0027s primary objective is to determine
        the extent, condition, volume, growth, and use of trees on the nation\u0027s
        forest land.\n\nDomain: continental U.S., 1928-2018\n\nResolution: plot-level
        (irregular polygon)\n\nThis dataset was curated and brought to Azure by [CarbonPlan](https://carbonplan.org/).\n","item_assets":{"data":{"type":"application/x-parquet","roles":["data"],"title":"Dataset
        root","table:storage_options":{"account_name":"cpdataeuwest"}}},"msft:region":"westeurope","stac_version":"1.0.0","table:tables":[{"name":"Survey
        Table","description":"Survey table. This table contains one record for each
        year an inventory is conducted in a State for annual inventory or one record
        for each periodic inventory. \u003Cbr\u003E\u003Cbr\u003E* SURVEY.CN = PLOT.SRV_CN
        links the unique inventory record for a State and year to the plot records.","msft:item_name":"survey"},{"name":"County
        Table","description":"County table. This table contains survey unit codes
        and is also a reference table for the county codes and names. \u003Cbr\u003E\u003Cbr\u003E*
        COUNTY.CN = PLOT.CTY_CN links the unique county record to the plot record.","msft:item_name":"county"},{"name":"Plot
        Table","description":"Plot table. This table provides information relevant
        to the entire 1-acre field plot. This table links to most other tables, and
        the linkage is made using PLOT.CN = TABLE_NAME.PLT_CN (TABLE_NAME is the name
        of any table containing the column name PLT_CN). Below are some examples of
        linking PLOT to other tables. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = COND.PLT_CN
        links the unique plot record to the condition class record(s). \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = SUBPLOT.PLT_CN links the unique plot record to the subplot records.
        \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = TREE.PLT_CN links the unique plot
        record to the tree records. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = SEEDLING.PLT_CN
        links the unique plot record to the seedling records.","msft:item_name":"plot"},{"name":"Condition
        Table","description":"Condition table. This table provides information on
        the discrete combination of landscape attributes that define the condition
        (a condition will have the same land class, reserved status, owner group,
        forest type, stand-size class, regeneration status, and stand density). \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = COND.PLT_CN links the condition class record(s) to the plot table.
        \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN = SITETREE.PLT_CN and COND.CONDID
        = SITETREE.CONDID links the condition class record to the site tree data.
        \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN = TREE.PLT_CN and COND.CONDID =
        TREE.CONDID links the condition class record to the tree data.","msft:item_name":"cond"},{"name":"Subplot
        Table","description":"Subplot table. This table describes the features of
        a single subplot. There are multiple subplots per 1-acre field plot and there
        can be multiple conditions sampled on each subplot. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = SUBPLOT.PLT_CN links the unique plot record to the subplot records.
        \u003Cbr\u003E\u003Cbr\u003E* SUBPLOT.PLT_CN = COND.PLT_CN and SUBPLOT.MACRCOND
        = COND.CONDID links the macroplot conditions to the condition class record.
        \u003Cbr\u003E\u003Cbr\u003E* SUBPLOT.PLT_CN = COND.PLT_CN and SUBPLOT.SUBPCOND
        = COND.CONDID links the subplot conditions to the condition class record.
        \u003Cbr\u003E\u003Cbr\u003E* SUBPLOT.PLT_CN = COND.PLT_CN and SUBPLOT.MICRCOND
        = COND.CONDID links the microplot conditions to the condition class record.","msft:item_name":"subplot"},{"name":"Subplot
        Condition Table","description":"Subplot condition table. This table contains
        information about the proportion of a subplot in a condition. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = SUBP_COND.PLT_CN links the subplot condition class record to the
        plot table. \u003Cbr\u003E\u003Cbr\u003E* SUBP_COND.PLT_CN = COND.PLT_CN and
        SUBP_COND.CONDID = COND.CONDID links the condition class records found on
        the four subplots to the subplot description.","msft:item_name":"subp_cond"},{"name":"boundary","description":"Boundary
        table. This table provides a description of the demarcation line between two
        conditions that occur on a single subplot","msft:item_name":"boundary"},{"name":"Subplot
        Condition Change Matrix","description":"Subplot condition change matrix table.
        This table contains information about the mix of current and previous conditions
        that occupy the same area on the subplot. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = SUBP_COND_CHNG_MTRX.PLT_CN links the subplot condition change matrix records
        to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* PLOT.PREV_PLT_CN
        = SUBP_COND_CHNG_MTRX.PREV_PLT_CN links the subplot condition change matrix
        records to the unique previous plot record.","msft:item_name":"subp_cond_chng_mtrx"},{"name":"Tree
        Table","description":"Tree table. This table provides information for each
        tree 1 inch in diameter and larger found on a microplot, subplot, or core
        optional macroplot. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = TREE.PLT_CN links
        the tree records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        COND.PLT_CN = TREE.PLT_CN and COND.CONDID = TREE.CONDID links the tree records
        to the unique condition record.","msft:item_name":"tree"},{"name":"Tree Woodland
        Stems Table","description":"Tree woodland stems table. This table stores data
        for the individual stems of a woodland species tree. Individual woodland stem
        diameter measurements contribute to the calculation of the diameter stored
        on the parent TREE table record. \u003Cbr\u003E\u003Cbr\u003E* TREE.CN = TREE_WOODLAND_STEMS.TRE_CN
        links a woodland stems record to the corresponding unique tree record.","msft:item_name":"tree_woodland_stems"},{"name":"Tree
        Regional Biomass Table","description":"Tree regional biomass table. This table
        contains biomass estimates computed using equations and methodology that varies
        by FIA work unit. This table retains valuable information for generating biomass
        estimates that match earlier published reports. \u003Cbr\u003E\u003Cbr\u003E*
        TREE.CN = TREE_REGIONAL_BIOMASS.TRE_CN links a tree regional biomass record
        to the corresponding unique tree.","msft:item_name":"tree_regional_biomass"},{"name":"Tree
        Net Growth, Removal, and Mortality Component Table","description":"Tree net
        growth, removal, and mortality component table. This table stores information
        used to compute net growth, removals, and mortality estimates for remeasurement
        trees. Each remeasurement tree has a single record in this table. \u003Cbr\u003E\u003Cbr\u003E*
        TREE_GRM_COMPONENT.TRE_CN = TREE.TRE_CN links the records in this table to
        the corresponding tree record in the TREE table.","msft:item_name":"tree_grm_component"},{"name":"Tree
        Net Growth, Removal, and Mortality Midpoint Table","description":"Tree net
        growth, removal, and mortality midpoint table. This table contains information
        about a remeasured tree at the midpoint of the remeasurement period. It does
        not contain a record for every tree. Midpoint estimates are computed for trees
        that experience mortality, removal, or land use diversion or reversion. The
        information in this table is used to compute net growth, removal, and mortality
        estimates on remeasurement trees. \u003Cbr\u003E\u003Cbr\u003E* TREE_GRM_MIDPT.TRE_CN
        = TREE.TRE_CN links the records in this table to the corresponding tree record
        in the TREE table.","msft:item_name":"tree_grm_midpt"},{"name":"Tree Net Growth,
        Removal, and Mortality Begin Table","description":"Tree net growth, removal,
        and mortality begin table. This table contains information for remeasured
        trees where values have been calculated for the beginning of the remeasurement
        period. Only those trees where information was recalculated for time 1 (T1)
        are included. The information in this table is used to produce net growth,
        removal and mortality estimates on remeasured trees. \u003Cbr\u003E\u003Cbr\u003E*
        TREE_GRM_BEGIN.TRE_CN = TREE.TRE_CN links the records in this table to the
        corresponding tree record in the TREE table.","msft:item_name":"tree_grm_begin"},{"name":"Tree
        Net Growth, Removal, and Mortality Estimation Table","description":"Tree net
        growth, removal, and mortality estimation table. This table contains information
        used to produce estimates of growth, removals and mortality. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = TREE_GRM_ESTN.PLT_CN links the tree GRM estimation records to the
        unique plot record. \u003Cbr\u003E\u003Cbr\u003E* TREE.CN = TREE_GRM_ESTN.TRE_CN
        links the tree GRM estimation records to the unique tree record.","msft:item_name":"tree_grm_estn"},{"name":"Seedling
        Table","description":"Seedling table. This table provides a count of the number
        of live trees of a species found on a microplot that are less than 1 inch
        in diameter but at least 6 inches in length for conifer species or at least
        12 inches in length for hardwood species. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = SEEDLING.PLT_CN links the seedling records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        COND.PLT_CN = SEEDLING.PLT_CN and COND.CONDID = SEEDLING.CONDID links the
        condition record to the seedling record.","msft:item_name":"seedling"},{"name":"Site
        Tree Table","description":"Site tree table. This table provides information
        on the site tree(s) collected in order to calculate site index and/or site
        productivity information for a condition. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = SITETREE.PLT_CN links the site tree records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        SITETREE.PLT_CN = COND.PLT_CN and SITETREE.CONDID = COND.CONDID links the
        site tree record(s) to the unique condition class record.","msft:item_name":"sitetree"},{"name":"Invasive
        Subplot Species Table","description":"Invasive subplot species table. This
        table provides percent cover data of invasive species identified on the subplot.
        \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = INVASIVE_SUBPLOT_SPP.PLT_CN links
        the invasive subplot species record(s) to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        SUBP_COND.PLT_CN = INVASIVE_SUBPLOT_SPP.PLT_CN and SUBP_COND.CONDID = INVASIVE_SUBPLOT_SPP.CONDID
        and SUBP_COND.SUBP = INVASIVE_SUBPLOT_SPP.SUBP links the invasive subplot
        species record(s) to the unique subplot condition record. \u003Cbr\u003E\u003Cbr\u003E*
        INVASIVE_SUBPLOT_SPP.VEG_SPCD = REF_PLANT_DICTIONARY.SYMBOL links the invasive
        vegetation subplot NRCS species code to the plant dictionary reference species
        code.","msft:item_name":"invasive_subplot_spp"},{"name":"Phase 2 Vegetation
        Subplot Species Table","description":"Phase 2 Vegetation subplot species table.
        This table provides percent cover data of vegetation species identified on
        the subplot. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = P2VEG_SUBPLOT_SPP.PLT_CN
        links the vegetation subplot species record(s) to the unique plot record.
        \u003Cbr\u003E\u003Cbr\u003E* SUBP_COND.PLT_CN = P2VEG_SUBPLOT_SPP.PLT_CN
        and SUBP_COND.CONDID = P2VEG_SUBPLOT_SPP.CONDID and SUBP_COND.SUBP = P2VEG_SUBPLOT_SPP.SUBP
        links the vegetation subplot species record(s) to the unique subplot condition
        record. \u003Cbr\u003E\u003Cbr\u003E* P2VEG_SUBPLOT_SPP.VEG_SPCD = REF_PLANT_DICTIONARY.SYMBOL
        links the P2 vegetation subplot NRCS species code to the plant dictionary
        reference species code.","msft:item_name":"p2veg_subplot_spp"},{"name":"Phase
        2 Vegetation Subplot Structure Table","description":"Phase 2 Vegetation subplot
        structure table. This table provides percent cover by layer by growth habit.
        \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = P2VEG_SUBP_STRUCTURE. PLT_CN links
        the subplot structure record(s) to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        SUBP_COND.PLT_CN = P2VEG_SUBP_STRUCTURE.PLT_CN and SUBP_COND.CONDID = P2VEG_SUBP_STRUCTURE.CONDID
        and SUBP_COND.SUBP = P2VEG_SUBP_STRUCTURE.SUBP links the vegetation subplot
        structure record(s) to the unique subplot condition record.","msft:item_name":"p2veg_subp_structure"},{"name":"Down
        Woody Material Visit Table","description":"Down woody material visit table.
        This table provides general information on down woody material indicator visit,
        such as the date of the DWM survey. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = DWM_VISIT.PLT_CN links the down woody material indicator visit record to
        the unique plot record.","msft:item_name":"dwm_visit"},{"name":"Down Woody
        Material Coarse Woody Debris Table","description":"Down woody material coarse
        woody debris table. This table provides information for each piece of coarse
        woody debris measured along the transects. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = DWM_COARSE_WOODY_DEBRIS.PLT_CN links the down woody material coarse woody
        debris records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN
        = DWM_COARSE_WOODY_DEBRIS.PLT_CN and COND.CONDID= DWM_COARSE_WOODY_DEBRIS.CONDID
        links the coarse woody debris records to the unique condition record.","msft:item_name":"dwm_coarse_woody_debris"},{"name":"Down
        Woody Material Duff, Litter, Fuel Table","description":"Down woody material
        duff, litter, fuel table. This table provides information on the duff, litter,
        fuelbed depths measured at a point on the transects. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = DWM_DUFF_LITTER_FUEL.PLT_CN links the duff, litter, fuelbed records
        to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN = DWM_DUFF_LITTER_FUEL.PLT_CN
        and COND.CONDID= DWM_DUFF_LITTER_FUEL.CONDID links the duff, litter, fuel
        records to the unique condition record.","msft:item_name":"dwm_duff_litter_fuel"},{"name":"Down
        Woody Material Fine Woody Debris Table","description":"Down woody material
        fine woody debris table. This table provides information on the fine woody
        debris measured along a segment of the transects. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = DWM_FINE_WOODY_DEBRIS.PLT_CN links the fine woody debris records
        to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN = DWM_FINE_WOODY_DEBRIS.PLT_CN
        and COND.CONDID= DWM_FINE_WOODY_DEBRIS.CONDID links the fine woody debris
        records to the unique condition record.","msft:item_name":"dwm_fine_woody_debris"},{"name":"Down
        Woody Material Microplot Fuel Table","description":"Down woody material microplot
        fuel table. This table provides information on the fuel loads (shrubs and
        herbs) measured on the microplot. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN =
        DWM_MICROPLOT_FUEL.PLT_CN links the microplot fuel records to the unique plot
        record.","msft:item_name":"dwm_microplot_fuel"},{"name":"Down Woody Material
        Residual Pile Table","description":"Down woody material residual pile table.
        This table provides information on the wood piles measured on the subplot.
        \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = DWM_RESIDUAL_PILE.PLT_CN links the
        wood piles records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E*
        COND.PLT_CN = DWM_RESIDUAL_PILE.PLT_CN and COND.CONDID= DWM_RESIDUAL_PILE.CONDID
        links the wood piles records to the unique condition record.","msft:item_name":"dwm_residual_pile"},{"name":"Down
        Woody Material Transect Segment Table","description":"Down woody material
        transect segment table. This table describes the down woody material transect
        segment lengths by condition class. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = DWM_TRANSECT_SEGMENT.PLT_CN links the down woody material transect length
        records to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN
        = DWM_TRANSECT_SEGMENT.PLT_CN and COND.CONDID= DWM_TRANSECT_SEGMENT.CONDID
        links the down woody material transect segment records to the unique condition
        record.","msft:item_name":"dwm_transect_segment"},{"name":"Condition Down
        Woody Material Calculation Table","description":"Condition down woody material
        calculation table. This table contains calculated values and condition-level
        estimates for down woody attributes by plot number (PLOT), condition class
        number (CONDID), and evaluation identifier (EVALID). \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = COND_DWM_CALC.PLT_CN links the down woody material calculation records
        to the unique plot record. \u003Cbr\u003E\u003Cbr\u003E* COND.CN = COND_DWM_CALC.CND_CN
        links the down woody material calculation records to the unique condition
        record. \u003Cbr\u003E\u003Cbr\u003E* POP_STRATUM. CN = COND_DWM_CALC.STRATUM_CN
        links the down woody material calculation records to the unique population
        stratum record.","msft:item_name":"cond_dwm_calc"},{"name":"Plot Regeneration
        Table","description":"Plot regeneration table. This table contains the information
        for the four subplots describing the amount of animal browse pressure exerted
        on the regeneration of trees. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN = PLOT_REGEN.PLT_CN
        links the unique plot record to the unique plot regeneration record.","msft:item_name":"plot_regen"},{"name":"Subplot
        Regeneration Table","description":"Subplot regeneration table. This table
        provides information on the subplot survey status and the site survey limitations,
        if any, for the tree regeneration study. \u003Cbr\u003E\u003Cbr\u003E* PLOT.CN
        = SUBPLOT_REGEN.PLT_CN links the unique plot record to the subplot regeneration
        records. \u003Cbr\u003E\u003Cbr\u003E* SUBPLOT.PLT_CN = SUBPLOT_REGEN.PLT_CN
        and SUBPLOT.SUBP = SUBPLOT_REGEN.SUBP links the subplot record to the subplot
        regeneration record.","msft:item_name":"subplot_regen"},{"name":"Seedling
        Regeneration Table","description":"Seedling regeneration. This table contains
        provides information on the seedling count by condition, species, source,
        and length class for the tree regeneration study. \u003Cbr\u003E\u003Cbr\u003E*
        PLOT.CN = SEEDLING_REGEN.PLT_CN links the unique plot record to the seedling
        regeneration records. \u003Cbr\u003E\u003Cbr\u003E* COND.PLT_CN = SEEDLING_REGEN.PLT_CN
        and COND.CONDID = SEEDLING_REGEN.CONDID links the regeneration seedling records
        to the unique condition record.","msft:item_name":"seedling_regen"},{"name":"Population
        Estimation Unit Table","description":"Population estimation unit table. This
        table contains information about estimation units. An estimation unit is a
        geographic area that can be drawn on a map. It has a known area, and the sampling
        intensity must be the same within a stratum within an estimation unit. Generally,
        estimation units are contiguous areas, but exceptions are made when certain
        ownerships, usually National Forests, are sampled at different intensities.
        One record in the POP_ESTN_UNIT table corresponds to a single estimation unit.
        POP_ESTN_UNIT.CN = POP_STRATUM.ESTN_UNIT_CN links the unique stratified geographical
        area (ESTN_UNIT) to the strata (STRATUMCD) that are assigned to each ESTN_UNIT.","msft:item_name":"pop_estn_unit"},{"name":"Population
        Evaluation Table","description":"Population evaluation table. This table provides
        information about evaluations. An evaluation is the combination of a set of
        plots (the sample) and a set of Phase 1 data (obtained through remote sensing,
        called a stratification) that can be used to produce population estimates
        for a State (an evaluation may be created to produce population estimates
        for a region other than a State, such as the Black Hills National Forest).
        A record in the POP_EVAL table identifies one evaluation and provides some
        descriptive information about how the evaluation may be used. \u003Cbr\u003E\u003Cbr\u003E*
        POP_ESTN_UNIT.EVAL_CN = POP_EVAL.CN links the unique evaluation identifier
        (EVALID) in the POP_EVAL table to the unique geographical areas (ESTN_UNIT)
        that are stratified. Within a population evaluation (EVALID) there can be
        multiple population estimation units, or geographic areas across which there
        are a number of values being estimated (e.g., estimation of volume across
        counties for a given State).","msft:item_name":"pop_eval"},{"name":"Population
        Evaluation Attribute Table","description":"Population evaluation attribute
        table. This table provides information as to which population estimates can
        be provided by an evaluation. If an evaluation can produce only 22 of all
        the population estimates in the REF_POP_ATTRIBUTE table, there will be 22
        records in the POP_EVAL_ATTRIBUTE table (one per population estimate) for
        that evaluation. \u003Cbr\u003E\u003Cbr\u003E* POP_EVAL.CN = POP_EVAL_ATTRIBUTE.EVAL_CN
        links the unique evaluation identifier to the list of population estimates
        that can be derived for that evaluation.","msft:item_name":"pop_eval_attribute"},{"name":"Population
        Evaluation Group Table","description":"Population evaluation group table.
        This table lists and describes the evaluation groups. One record in the POP_EVAL_GRP
        table can be linked to all the evaluations that were used in generating estimates
        for a State inventory report. \u003Cbr\u003E\u003Cbr\u003E* POP_EVAL_GRP.CN
        = POP_EVAL_TYP.EVAL_GRP_CN links the evaluation group record to the evaluation
        type record.","msft:item_name":"pop_eval_grp"},{"name":"Population Evaluation
        Type Table","description":"Population evaluation type table. This table provides
        information on the type of evaluations that were used to generate a set of
        tables for an inventory report. In a typical State inventory report, one evaluation
        is used to generate an estimate of the total land area; a second evaluation
        is used to generate current estimates of volume, numbers of trees and biomass;
        and a third evaluation is used for estimating growth, removals and mortality.
        \u003Cbr\u003E\u003Cbr\u003E* POP_EVAL_TYP.EVAL_CN = POP_EVAL.CN links the
        evaluation type record to the evaluation record. \u003Cbr\u003E\u003Cbr\u003E*
        POP_EVAL_TYP.EVAL_GRP_CN = POP_EVAL_GRP.CN links the evaluation type record
        to the evaluation group record. \u003Cbr\u003E\u003Cbr\u003E* POP_EVAL_TYP.EVAL_TYP
        = REF_POP_EVAL_TYP_DESCR.EVAL_TYP links an evaluation type record to an evaluation
        type description reference record.","msft:item_name":"pop_eval_typ"},{"name":"Population
        Plot Stratum Assignment Table","description":"Population plot stratum assignment
        table. This table provides a way to assign stratum information to a plot.
        Stratum information is assigned to a plot by overlaying the plot\u0027s location
        on the Phase 1 imagery. Plots are linked to their appropriate stratum for
        an evaluation via the POP_PLOT_STRATUM_ASSGN table. \u003Cbr\u003E\u003Cbr\u003E*
        POP_PLOT_STRATUM_ASSGN.PLT_CN = PLOT.CN links the stratum assigned to the
        plot record.","msft:item_name":"pop_plot_stratum_assgn"},{"name":"Population
        Stratum Table","description":"Population stratum table. This table provides
        information about individual strata. The area within an estimation unit is
        divided into strata. The area for each stratum can be calculated by determining
        the proportion of Phase 1 pixels/plots in each stratum and multiplying that
        proportion by the total area in the estimation unit. Information for a single
        stratum is stored in a single record of the POP_STRATUM table. \u003Cbr\u003E\u003Cbr\u003E*
        POP_STRATUM.CN = POP_PLOT_STRATUM_ASSGN.STRATUM_CN links the defined stratum
        to each plot.","msft:item_name":"pop_stratum"},{"name":"Plot Geometry Table","description":"Plot
        geometry table. This table contains geometric attributes associated with the
        plot location, such as the hydrological unit and roadless codes. \u003Cbr\u003E\u003Cbr\u003E*
        PLOTGEOM.CN = PLOT.CN links the unique plot record between the two tables.","msft:item_name":"plotgeom"},{"name":"Plot
        Snapshot Table","description":"Plot snapshot table. This table combines the
        information in the PLOT table with information in the PLOT_EVAL_GRP and POP_STRATUM
        tables to provide a snapshot of the plot records with their associated expansion
        and adjustment factors. \u003Cbr\u003E\u003Cbr\u003E* PLOTSNAP.CN = PLOT.CN
        links the unique plot record between the two tables.","msft:item_name":"plotsnap"}],"msft:_created":"2026-10-12T16:14:49.6666963Z","msft:_updated":"2026-10-19T16:28:12.0424319Z","msft:container":"cpdata","storage:schemes":{"azure":{"type":"ms-azure","region":"westeurope","account":"cpdataeuwest","platform":"https://{account}.blob.core.windows.net","container":"cpdata"}},"msft:storage_account":"cpdataeuwest","msft:short_description":"Status
        and trends on U.S. forest location, health, growth, mortality, and production,
        from the U.S. Forest Service\u0027s Forest Inventory and Analysis (FIA) program"}'
