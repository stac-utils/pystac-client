        Impact Lab","Rhodium Group","Precipitation","Temperature"],"providers":[{"url":"https://impactlab.org/","name":"Climate
        Impact Lab","roles":["producer"]},{"url":"https://planetarycomputer.microsoft.com/","name":"Microsoft","roles":["host"]}],"summaries":{"cmip6:variable":["pr","tasmax","tasmin"],"cmip6:source_id":["BCC-CSM2-MR","ACCESS-ESM1-5","ACCESS-CM2","MIROC-ES2L","MIROC6","NorESM2-LM","NorESM2-MM","GFDL-CM4","GFDL-ESM4","NESM3","MPI-ESM1-2-HR","HadGEM3-GC31-LL","UKESM1-0-LL","MPI-ESM1-2-LR","EC-Earth3","EC-Earth3-AerChem","EC-Earth3-CC","EC-Earth3-Veg","EC-Earth3-Veg-LR","CMCC-CM2-SR5","CMCC-ESM2"],"cmip6:experiment_id":["historical","ssp126","ssp245","ssp370","ssp585"],"cmip6:institution_id":["BCC","CAS","CCCma","CMCC","CSIRO","CSIRO-ARCCSS","DKRZ","EC-Earth-Consortium","INM","MIROC","MOHC","MPI-M","NCC","NOAA-GFDL","NUIST"]},"description":"The
        World Climate Research Programme\u0027s [6th Coupled Model Intercomparison
        Project (CMIP6)](https://www.wcrp-climate.org/wgcm-cmip/wgcm-cmip6) represents
        an enormous advance in the quality, detail, and scope of climate modeling.\n\nThe
        [Global Downscaled Projections for Climate Impacts Research](https://github.com/ClimateImpactLab/downscaleCMIP6)
        dataset makes this modeling more applicable to understanding the impacts of
        changes in the climate on humans and society with two key developments: trend-preserving
        bias correction and downscaling. In this dataset, the [Climate Impact Lab](https://impactlab.org)
        provides global, daily minimum and maximum air temperature at the surface
        (\u0060tasmin\u0060 and \u0060tasmax\u0060) and daily cumulative surface precipitation
        (\u0060pr\u0060) corresponding to the CMIP6 historical, ssp1-2.6, ssp2-4.5,
        ssp3-7.0, and ssp5-8.5 scenarios for 25 global climate models on a 1/4-degree
        regular global grid.\n\n## Accessing the data\n\nGDPCIR data can be accessed
        on the Microsoft Planetary Computer. The dataset is made of of three collections,
        distinguished by data license:\n* [Public domain (CC0-1.0) collection](https://planetarycomputer.microsoft.com/dataset/cil-gdpcir-cc0)\n*
        [Attribution (CC BY 4.0) collection](https://planetarycomputer.microsoft.com/dataset/cil-gdpcir-cc-by)\n\nEach
        modeling center with bias corrected and downscaled data in this collection
        falls into one of these license categories - see the [table below](/dataset/cil-gdpcir-cc-by#available-institutions-models-and-scenarios-by-license-collection)
        to see which model is in each collection, and see the section below on [Citing,
        Licensing, and using data produced by this project](/dataset/cil-gdpcir-cc-by#citing-licensing-and-using-data-produced-by-this-project)
        for citations and additional information about each license.\n\n## Data format
        \u0026 contents\n\nThe data is stored as partitioned zarr stores (see [https://zarr.readthedocs.io](https://zarr.readthedocs.io)),
        each of which includes thousands of data and metadata files covering the full
        time span of the experiment. Historical zarr stores contain just over 50 GB,
        while SSP zarr stores contain nearly 70GB. Each store is stored as a 32-bit
        float, with dimensions time (daily datetime), lat (float latitude), and lon
        (float longitude). The data is chunked at each interval of 365 days and 90
        degree interval of latitude and longitude. Therefore, each chunk is \u0060(365,
        360, 360)\u0060, with each chunk occupying approximately 180MB in memory.\n\nHistorical
        data is daily, excluding leap days, from Jan 1, 1950 to Dec 31, 2014; SSP
        data is daily, excluding leap days, from Jan 1, 2015 to either Dec 31, 2099
        or Dec 31, 2100, depending on data availability in the source GCM.\n\nThe
        spatial domain covers all 0.25-degree grid cells, indexed by the grid center,
        with grid edges on the quarter-degree, using a -180 to 180 longitude convention.
        Thus, the \u201Clon\u201D coordinate extends from -179.875 to 179.875, and
        the \u201Clat\u201D coordinate extends from -89.875 to 89.875, with intermediate
        values at each 0.25-degree increment between (e.g. -179.875, -179.625, -179.375,
        etc).\n\n## Available institutions, models, and scenarios by license collection\n\n|
        Modeling institution |   Source model    |           Available experiments            |   License
        collection   |\n| -------------------- | ----------------- | ------------------------------------------
        | ---------------------- |\n| CAS                  | FGOALS-g3 [^1]    | SSP2-4.5,
        SSP3-7.0, and SSP5-8.5           | Public domain datasets |\n| INM                  |
        INM-CM4-8         | SSP1-2.6, SSP2-4.5, SSP3-7.0, and SSP5-8.5 | Public domain
        datasets |\n| INM                  | INM-CM5-0         | SSP1-2.6, SSP2-4.5,
        SSP3-7.0, and SSP5-8.5 | Public domain datasets |\n| BCC                  |
        BCC-CSM2-MR       | SSP1-2.6, SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n|
        CMCC                 | CMCC-CM2-SR5      | ssp1-2.6, ssp2-4.5, ssp3-7.0, ssp5-8.5     |
        CC-BY-40               |\n| CMCC                 | CMCC-ESM2         | ssp1-2.6,
        ssp2-4.5, ssp3-7.0, ssp5-8.5     | CC-BY-40               |\n| CSIRO-ARCCSS         |
        ACCESS-CM2        | SSP2-4.5 and SSP3-7.0                      | CC-BY-40               |\n|
        CSIRO                | ACCESS-ESM1-5     | SSP1-2.6, SSP2-4.5, and SSP3-7.0           |
        CC-BY-40               |\n| MIROC                | MIROC-ES2L        | SSP1-2.6,
        SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n| MIROC                |
        MIROC6            | SSP1-2.6, SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n|
        MOHC                 | HadGEM3-GC31-LL   | SSP1-2.6, SSP2-4.5, and SSP5-8.5           |
        CC-BY-40               |\n| MOHC                 | UKESM1-0-LL       | SSP1-2.6,
        SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n| MPI-M                |
        MPI-ESM1-2-LR     | SSP1-2.6, SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n|
        MPI-M/DKRZ [^2]      | MPI-ESM1-2-HR     | SSP1-2.6 and SSP5-8.5                      |
        CC-BY-40               |\n| NCC                  | NorESM2-LM        | SSP1-2.6,
        SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n| NCC                  |
        NorESM2-MM        | SSP1-2.6, SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n|
        NOAA-GFDL            | GFDL-CM4          | SSP2-4.5 and SSP5-8.5                      |
        CC-BY-40               |\n| NOAA-GFDL            | GFDL-ESM4         | SSP1-2.6,
        SSP2-4.5, SSP3-7.0, and SSP5-8.5 | CC-BY-40               |\n| NUIST                |
        NESM3             | SSP1-2.6, SSP2-4.5, and SSP5-8.5           | CC-BY-40               |\n|
        EC-Earth-Consortium  | EC-Earth3         | ssp1-2.6, ssp2-4.5, ssp3-7.0, and
        ssp5-8.5 | CC-BY-40               |\n| EC-Earth-Consortium  | EC-Earth3-AerChem
        | ssp370                                     | CC-BY-40               |\n|
        EC-Earth-Consortium  | EC-Earth3-CC      | ssp245 and ssp585                          |
        CC-BY-40               |\n| EC-Earth-Consortium  | EC-Earth3-Veg     | ssp1-2.6,
        ssp2-4.5, ssp3-7.0, and ssp5-8.5 | CC-BY-40               |\n| EC-Earth-Consortium  |
        EC-Earth3-Veg-LR  | ssp1-2.6, ssp2-4.5, ssp3-7.0, and ssp5-8.5 | CC-BY-40               |\n|
        CCCma                | CanESM5           | ssp1-2.6, ssp2-4.5, ssp3-7.0, ssp5-8.5     |
        CC-BY-40[^3]           |\n\n*Notes:*\n\n[^1]: At the time of running, no ssp1-2.6
        precipitation data was available. Therefore, we provide \u0060tasmin\u0060
        and \u0060tamax\u0060 for this model and experiment, but not \u0060pr\u0060.
        All other model/experiment combinations in the above table include all three
        variables.\n\n[^2]: The institution which ran MPI-ESM1-2-HR\u2019s historical
        (CMIP) simulations is \u0060MPI-M\u0060, while the future (ScenarioMIP) simulations
        were run by \u0060DKRZ\u0060. Therefore, the institution component of \u0060MPI-ESM1-2-HR\u0060
        filepaths differ between \u0060historical\u0060 and \u0060SSP\u0060 scenarios.\n\n[^3]:
        This dataset was previously licensed as [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/),
        but was relicensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0)
        in March, 2023. \n\n## Project methods\n\nThis project makes use of statistical
        bias correction and downscaling algorithms, which are specifically designed
        to accurately represent changes in the extremes. For this reason, we selected
        Quantile Delta Mapping (QDM), following the method introduced by [Cannon et
        al. (2015)](https://doi.org/10.1175/JCLI-D-14-00754.1), which preserves quantile-specific
        trends from the GCM while fitting the full distribution for a given day-of-year
        to a reference dataset (ERA5).\n\nWe then introduce a similar method tailored
        to increase spatial resolution while preserving extreme behavior, Quantile-Preserving
        Localized-Analog Downscaling (QPLAD).\n\nTogether, these methods provide a
        robust means to handle both the central and tail behavior seen in climate
        model output, while aligning the full distribution to a state-of-the-art reanalysis
        dataset and providing the spatial granularity needed to study surface impacts.\n\nFor
        further documentation, see [Global downscaled projections for climate impacts
        research (GDPCIR): preserving extremes for modeling future climate impacts](https://egusphere.copernicus.org/preprints/2023/egusphere-2022-1513/)
        (EGUsphere, 2022 [preprint]).\n\n## Citing, licensing, and using data produced
        by this project\n\nProjects making use of the data produced as part of the
        Climate Impact Lab Global Downscaled Projections for Climate Impacts Research
        (CIL GDPCIR) project are requested to cite both this project and the source
        datasets from which these results are derived. Additionally, the use of data
        derived from some GCMs *requires* citations, and some modeling centers impose
        licensing restrictions \u0026 requirements on derived works. See each GCM\u0027s
        license info in the links below for more information.\n\n### CIL GDPCIR\n\nUsers
        are requested to cite this project in derived works. Our method documentation
        paper may be cited using the following:\n\n\u003E Gergel, D. R., Malevich,
        S. B., McCusker, K. E., Tenezakis, E., Delgado, M. T., Fish, M. A., and Kopp,
        R. E.: Global downscaled projections for climate impacts research (GDPCIR):
        preserving extremes for modeling future climate impacts, EGUsphere [preprint],
        https://doi.org/10.5194/egusphere-2022-1513, 2023. \n\nThe code repository
        may be cited using the following:\n\n\u003E Diana Gergel, Kelly McCusker,
        Brewster Malevich, Emile Tenezakis, Meredith Fish, Michael Delgado (2022).
        ClimateImpactLab/downscaleCMIP6: (v1.0.0). Zenodo. https://doi.org/10.5281/zenodo.6403794\n\n###
        ERA5\n\nAdditionally, we request you cite the historical dataset used in bias
        correction and downscaling, ERA5. See the [ECMWF guide to citing a dataset
        on the Climate Data Store](https://confluence.ecmwf.int/display/CKB/How\u002Bto\u002Backnowledge\u002Band\u002Bcite\u002Ba\u002BClimate\u002BData\u002BStore\u002B%28CDS%29\u002Bcatalogue\u002Bentry\u002Band\u002Bthe\u002Bdata\u002Bpublished\u002Bas\u002Bpart\u002Bof\u002Bit):\n\n\u003E
        Hersbach, H, et al. The ERA5 global reanalysis. Q J R Meteorol Soc.2020; 146:
        1999\u20132049. DOI: [10.1002/qj.3803](https://doi.org/10.1002/qj.3803)\n\u003E\n\u003E
        Mu\u00F1oz Sabater, J., (2019): ERA5-Land hourly data from 1981 to present.
        Copernicus Climate Change Service (C3S) Climate Data Store (CDS). (Accessed
        on June 4, 2021), DOI: [10.24381/cds.e2161bac](https://doi.org/10.24381/cds.e2161bac)\n\u003E\n\u003E
        Mu\u00F1oz Sabater, J., (2021): ERA5-Land hourly data from 1950 to 1980. Copernicus
        Climate Change Service (C3S) Climate Data Store (CDS). (Accessed on June 4,
        2021), DOI: [10.24381/cds.e2161bac](https://doi.org/10.24381/cds.e2161bac)\n\n###
        GCM-specific citations \u0026 licenses\n\nThe CMIP6 simulation data made available
        through the Earth System Grid Federation (ESGF) are subject to Creative Commons
        [BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/) or [BY-NC-SA
        4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) licenses. The Climate
        Impact Lab has reached out to each of the modeling institutions to request
        waivers from these terms so the outputs of this project may be used with fewer
        restrictions, and has been granted permission to release the data using the
        licenses listed here.\n\n#### Public Domain Datasets\n\nThe following bias
        corrected and downscaled model simulations are available in the public domain
        using a [CC0 1.0 Universal Public Domain Declaration](https://creativecommons.org/publicdomain/zero/1.0/).
        Access the collection on Planetary Computer at https://planetarycomputer.microsoft.com/dataset/cil-gdpcir-cc0.\n\n*
