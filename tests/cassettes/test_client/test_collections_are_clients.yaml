        SSP3-7.0 version 20190820; SSP5-8.5 tasmax version 20190819; SSP5-8.5 tasmin
        version 20190819; SSP5-8.5 pr version 20190818. Earth System Grid Federation.
        https://doi.org/10.22033/ESGF/CMIP6.2056\n\n\n* **INM-CM4-8**\n\n  License
